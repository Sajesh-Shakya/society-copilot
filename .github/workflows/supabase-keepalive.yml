name: Supabase Keep-Alive
on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon & Thu — gap between pings stays under Supabase's 7-day pause
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is not configured" >&2; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is not configured" >&2; exit 1; }
          echo "Testing Supabase connection..."
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$SUPABASE_URL/auth/v1/settings" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
